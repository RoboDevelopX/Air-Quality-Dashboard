[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqd"
version = "0.1.0"
description = "Air quality dashboard with a PM2.5 forecasting model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
# Only needed to retrain models (scripts/train.py); the app never imports statsmodels.
train = ["statsmodels>=0.14", "matplotlib>=3.9"]
dev = [
    "aqd[train]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.17",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqd = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "N",       # pep8-naming
    "PTH",     # prefer pathlib
    "DTZ",     # timezone-aware datetimes
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow µ, ³, ° etc. in strings/comments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/aqd", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly.*", "lightgbm.*", "statsmodels.*", "joblib.*", "sklearn.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that fit real models (deselect with -m 'not slow')"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["aqd"]
branch = true
omit = ["src/aqd/ui/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
